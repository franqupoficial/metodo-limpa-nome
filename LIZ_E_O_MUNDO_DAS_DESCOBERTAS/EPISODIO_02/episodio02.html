const E={out:t=>1-Math.pow(1-t,3),inOut:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,back:t=>{const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);},elastic:t=>t<=0?0:t>=1?1:Math.pow(2,-10*t)*Math.sin((t*10-.75)*2*Math.PI/3)+1};
const lerp=(a,b,p)=>a+(b-a)*p;
const r1=n=>Math.round(n*10)/10;
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const at=(x,y,s,inner,extra='')=>`<g transform="translate(${r1(x)} ${r1(y)}) scale(${s})" ${extra}>${inner}</g>`;

/* ---------------- roteiro (gerado por FERRAMENTAS/montar_linha_do_tempo.py a partir de roteiro_ep02.json) ---------------- */

const LINES=[[17.4, 20.18, "LIZ", "Uau! Pipo, olha que floresta linda!"], [20.48, 23.17, "LIZ", "Será que existem animaizinhos morando aqui?"], [25.97, 26.97, "PIPO", "Au! Au!"], [27.17, 28.92, "LIZ", "Então vamos descobrir!"], [29.62, 33.87, "LUMI", "Venham comigo! A floresta está cheia de amigos!"], [37.27, 40.03, "LIZ", "Olha, Pipo! Um coelhinho!"], [40.43, 43.41, "LIZ", "Você sabia que o coelhinho tem orelhas compridas?"], [43.71, 45.48, "LIZ", "E sabe como ele se movimenta?"], [48.48, 50.57, "LIZ", "Isso mesmo! Ele pula!"], [50.87, 52.96, "LIZ", "Vamos pular igual ao coelhinho?"], [53.16, 55.34, "LIZ", "Pula! Pula! Pula!"], [60.94, 62.6, "LIZ", "Uau! É um leão!"], [62.9, 65.4, "LIZ", "O leão é conhecido como o rei da floresta!"], [65.7, 67.83, "LIZ", "Você sabe que som o leão faz?"], [70.83, 72.83, "LEAO", "ROOOAAARRR!"], [73.03, 75.31, "LIZ", "Muito bem! O leão ruge!"], [75.51, 76.71, "PIPO", "Au?! Au!"], [80.21, 82.56, "LIZ", "Olha só! Um macaquinho!"], [82.76, 84.36, "MACACO", "Uh! Uh! Ah! Ah!"], [84.66, 87.38, "LIZ", "O macaquinho gosta de subir nas árvores!"], [90.58, 92.57, "LIZ", "Obrigada, amiguinho!"], [97.17, 99.57, "LIZ", "Nossa! Que pescoço comprido!"], [99.77, 100.94, "LIZ", "É uma girafa!"], [101.24, 104.96, "LIZ", "Ela usa seu pescoço comprido para alcançar folhas lá no alto!"], [105.26, 108.26, "LIZ", "Estique o pescoço bem alto, igual à girafa!"], [113.66, 115.49, "LIZ", "Olha! Um elefante!"], [115.79, 118.69, "LIZ", "Você sabia que ele tem uma tromba muito especial?"], [118.99, 120.74, "LIZ", "E sabe que som ele faz?"], [123.74, 125.54, "ELEFANTE", "PRUUUUU!"], [125.84, 128.41, "LIZ", "Isso mesmo! Que som divertido!"], [133.01, 135.36, "LIZ", "Hoje conhecemos muitos animais!"], [135.66, 137.03, "LIZ", "O coelhinho pula,"], [137.15, 138.33, "LIZ", "o leão ruge,"], [138.45, 140.73, "LIZ", "o macaquinho sobe nas árvores,"], [140.85, 143.15, "LIZ", "a girafa tem um pescoço comprido"], [143.27, 145.26, "LIZ", "e o elefante tem uma tromba!"], [145.66, 148.06, "LIZ", "Cada um é especial do seu jeitinho!"], [148.26, 150.59, "LIZ", "E todos merecem carinho e respeito!"], [150.79, 151.79, "PIPO", "Au! Au!"], [153.99, 156.49, "LIZ", "Foi muito divertido aprender com vocês!"], [156.79, 159.45, "LIZ", "Até a próxima aventura, amiguinhos!"]];
const PAUSES=[[23.17, 25.97], [45.48, 48.48], [55.34, 58.34], [67.83, 70.83], [108.26, 111.06], [120.74, 123.74]];

/* ---------------- cenários ---------------- */
function nuvem(x,y,s,op=1){return `<g transform="translate(${r1(x)} ${y}) scale(${s})" opacity="${op}"><ellipse cx="0" cy="0" rx="90" ry="38" fill="#fff"/><circle cx="-40" cy="-20" r="40" fill="#fff"/><circle cx="20" cy="-34" r="50" fill="#fff"/><circle cx="62" cy="-10" r="34" fill="#fff"/><ellipse cx="0" cy="18" rx="88" ry="14" fill="#E3F1FF"/></g>`;}
function arvore(x,y,s,c1='#4FB54A',c2='#6FD167'){return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-22 0 Q -16 -110 -10 -170 L 10 -170 Q 16 -110 24 0 Z" fill="#8E5A2E"/><path d="M-6 -150 Q 4 -110 2 -40" stroke="#6E4220" stroke-width="5" fill="none"/><circle cx="0" cy="-230" r="90" fill="${c1}"/><circle cx="-70" cy="-190" r="62" fill="${c1}"/><circle cx="70" cy="-190" r="62" fill="${c1}"/><circle cx="-20" cy="-262" r="58" fill="${c2}"/><circle cx="44" cy="-226" r="40" fill="${c2}"/><circle cx="-60" cy="-206" r="30" fill="${c2}"/></g>`;}
function flor(x,y,s,cor,t,miolo='#FFD23F'){const sw=Math.sin(t*2+x*.01)*6;return `<g transform="translate(${r1(x)} ${y}) rotate(${r1(sw)}) scale(${s})"><path d="M0 0 Q 4 -30 0 -60" stroke="#3E9C42" stroke-width="5" fill="none"/><ellipse cx="10" cy="-26" rx="12" ry="6" fill="#56B84F" transform="rotate(-30 10 -26)"/>${[0,72,144,216,288].map(a=>`<ellipse cx="0" cy="-74" rx="10" ry="15" fill="${cor}" transform="rotate(${a} 0 -62)"/>`).join('')}<circle cx="0" cy="-62" r="9" fill="${miolo}"/></g>`;}
function casaArvore(x,y){return `<g transform="translate(${x} ${y})"><path d="M-40 0 Q -30 -240 -24 -360 L 24 -360 Q 30 -240 44 0 Z" fill="#8E5A2E"/><circle cx="0" cy="-470" r="150" fill="#43A845"/><circle cx="-110" cy="-400" r="100" fill="#43A845"/><circle cx="110" cy="-410" r="100" fill="#4FB54A"/><circle cx="-30" cy="-520" r="90" fill="#62C75C"/>
  <rect x="-110" y="-360" width="220" height="16" rx="6" fill="#7B4A24"/><rect x="-90" y="-480" width="180" height="120" rx="10" fill="#D79A5B"/><path d="M-110 -476 L 0 -560 L 110 -476 Z" fill="#E2574C"/><rect x="-30" y="-450" width="60" height="90" rx="26" fill="#7B4A24"/><circle cx="-56" cy="-430" r="16" fill="#FFE79A"/><circle cx="56" cy="-430" r="16" fill="#FFE79A"/>
  <path d="M60 -350 L 150 -60 M 90 -350 L 180 -60" stroke="#A9733E" stroke-width="6"/>${[0,1,2,3,4,5,6].map(i=>`<path d="M${66+i*13} ${-320+i*40} h 30" stroke="#A9733E" stroke-width="6"/>`).join('')}</g>`;}
function fundoFloresta(t,extra=''){
  let s=`<linearGradient id="ceu1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6EC6FF"/><stop offset=".7" stop-color="#CFEFFF"/><stop offset="1" stop-color="#F1FAFF"/></linearGradient>`;
  s+=`<rect x="-400" y="-200" width="2720" height="1480" fill="url(#ceu1)"/>`;
  s+=`<circle cx="1640" cy="150" r="90" fill="#FFF6B8" filter="url(#brilhoForte)" opacity=".9"/>`;
  s+=nuvem(200+t*8%400,170,1.1,.95)+nuvem(900+t*5,110,.8,.9)+nuvem(1450-t*4,230,1,.9);
  s+=`<path d="M-400 700 Q 200 560 700 660 Q 1200 760 1600 610 Q 1900 520 2300 640 L 2300 1300 L -400 1300 Z" fill="#A6E39A"/>`;
  s+=`<path d="M-400 780 Q 400 680 900 760 Q 1400 840 2300 720 L 2300 1300 L -400 1300 Z" fill="#86D474"/>`;
  s+=arvore(1500,760,.9,'#3E9F45','#5CC25A')+arvore(1760,780,1.1)+arvore(560,760,.8,'#3E9F45','#5CC25A');
  s+=casaArvore(150,880);
  s+=`<path d="M-400 900 Q 600 840 1100 880 Q 1600 920 2300 870 L 2300 1300 L -400 1300 Z" fill="#74C95F"/>`;
  s+=`<path d="M700 1300 Q 820 980 980 900 Q 1080 860 1240 870 Q 1080 960 1060 1300 Z" fill="#F2D49B" opacity=".9"/>`;
  const R=rng(5);for(let i=0;i<34;i++){const x=R()*2300-200,y=900+R()*170;s+=flor(x,y,.7+R()*.5,['#FF6FB5','#B667F2','#FFFFFF','#FFB13B'][i%4],t);}
  return s+extra;
}
function porta(x,y,abrir,t){ /* porta azul no tronco gigante */
  const a=E.inOut(abrir);
  let s=`<g transform="translate(${x} ${y})">`;
  s+=`<path d="M-260 0 Q -230 -300 -190 -620 L 190 -620 Q 230 -300 270 0 Q 120 30 0 10 Q -130 30 -260 0 Z" fill="#8A552B"/>`;
  s+=`<path d="M-150 -560 Q -130 -300 -170 -40 M140 -580 Q 160 -300 130 -60 M-60 -600 Q -40 -500 -70 -420" stroke="#6D3F1D" stroke-width="8" fill="none" stroke-linecap="round"/>`;
  s+=`<circle cx="0" cy="-760" r="250" fill="#3E9F45"/><circle cx="-220" cy="-660" r="170" fill="#4FB54A"/><circle cx="230" cy="-660" r="170" fill="#4FB54A"/><circle cx="-60" cy="-860" r="160" fill="#62C75C"/>`;
  /* luz de dentro */
  s+=`<radialGradient id="luzPorta"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#FFF2B0"/><stop offset="1" stop-color="#FF9ED8"/></radialGradient>`;
  s+=`<path d="M-100 -20 L -100 -250 Q -100 -350 0 -350 Q 100 -350 100 -250 L 100 -20 Z" fill="url(#luzPorta)"/>`;
  if(a>0){for(let i=0;i<9;i++){const ang=-90+(i-4)*16;const L=300+200*a;s+=`<path d="M0 -180 L ${r1(Math.cos((ang-5)*Math.PI/180)*L)} ${r1(-180+Math.sin((ang-5)*Math.PI/180)*L)} L ${r1(Math.cos((ang+5)*Math.PI/180)*L)} ${r1(-180+Math.sin((ang+5)*Math.PI/180)*L)} Z" fill="#FFF6C8" opacity="${r1(.35*a)}"/>`;}}
  /* folha da porta (abre pela dobradiça esquerda) */
  const sx=r1(1-a*.92);
  s+=`<g transform="translate(-100 0) scale(${sx} 1)"><path d="M0 -20 L 0 -250 Q 0 -350 100 -350 Q 200 -350 200 -250 L 200 -20 Z" fill="#2F7DF6" stroke="#F7C744" stroke-width="10"/><path d="M30 -60 L 30 -240 Q 30 -316 100 -318 Q 170 -316 170 -240 L 170 -60 Z" fill="none" stroke="#1E5FC8" stroke-width="6"/>${estrela(100,-250,26,0)}<circle cx="168" cy="-160" r="12" fill="#F7C744"/></g>`;
  s+=`<path d="M-112 -14 L -112 -252 Q -112 -362 0 -362 Q 112 -362 112 -252 L 112 -14" stroke="#F7C744" stroke-width="12" fill="none"/>`;
  const gl=.25+.25*Math.sin(t*4);s+=`<path d="M-112 -14 L -112 -252 Q -112 -362 0 -362 Q 112 -362 112 -252 L 112 -14" stroke="#9FD0FF" stroke-width="24" fill="none" opacity="${r1(gl)}" filter="url(#brilhoForte)"/>`;
  return s+`</g>`;
}
/* Mundo mágico: grupos com saturação independente */
function mundo(t,sat){
  const satF=(id,v)=>`<filter id="${id}"><feColorMatrix type="saturate" values="${v.toFixed(3)}"/><feComponentTransfer><feFuncR type="linear" slope="${(0.85+0.15*v).toFixed(3)}"/><feFuncG type="linear" slope="${(0.85+0.15*v).toFixed(3)}"/><feFuncB type="linear" slope="${(0.85+0.15*v).toFixed(3)}"/></feComponentTransfer></filter>`;
  let s=satF('sBase',sat.base)+satF('sRed',sat.red)+satF('sYel',sat.yel)+satF('sBlu',sat.blu);
  /* base */
  s+=`<g filter="url(#sBase)"><linearGradient id="ceu2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FD0FF"/><stop offset=".65" stop-color="#FFD9F0"/><stop offset="1" stop-color="#FFF4E0"/></linearGradient><rect x="-400" y="-200" width="2720" height="1480" fill="url(#ceu2)"/>`;
  s+=nuvem(300+t*6,150,1,.9)+nuvem(1200-t*5,110,.8,.85)+nuvem(1700,240,.9,.8);
  /* castelo */
  s+=`<g transform="translate(1120 640) scale(.9)"><rect x="-160" y="-220" width="320" height="220" fill="#C99BF0"/><rect x="-220" y="-300" width="80" height="300" fill="#B780E8"/><rect x="140" y="-300" width="80" height="300" fill="#B780E8"/><rect x="-40" y="-380" width="80" height="200" fill="#B780E8"/><path d="M-230 -300 L -180 -400 L -130 -300 Z M130 -300 L 180 -400 L 230 -300 Z M-50 -380 L 0 -490 L 50 -380 Z" fill="#FF6FB5"/><rect x="-36" y="-110" width="72" height="110" rx="36" fill="#7B4FC9"/><circle cx="-180" cy="-220" r="16" fill="#FFF2B0"/><circle cx="180" cy="-220" r="16" fill="#FFF2B0"/><circle cx="0" cy="-300" r="16" fill="#FFF2B0"/></g>`;
  s+=`<path d="M-400 700 Q 300 580 800 660 Q 1300 740 1700 630 Q 2000 560 2320 640 L 2320 1300 L -400 1300 Z" fill="#9EE08E"/>`;
  s+=`<path d="M-400 820 Q 500 730 1000 800 Q 1500 870 2320 780 L 2320 1300 L -400 1300 Z" fill="#7ACF68"/>`;
  s+=arvore(1820,800,1,'#3E9F45','#5CC25A')+arvore(820,780,.7,'#3E9F45','#5CC25A');
  s+=`<path d="M-400 920 Q 700 860 1200 900 Q 1700 940 2320 900 L 2320 1300 L -400 1300 Z" fill="#6BC45A"/>`;
  /* porta azul deste lado */
  s+=`<g transform="translate(150 930) scale(.55)"><path d="M-100 -20 L -100 -250 Q -100 -350 0 -350 Q 100 -350 100 -250 L 100 -20 Z" fill="#2F7DF6" stroke="#F7C744" stroke-width="12"/>${estrela(0,-250,26,0)}</g>`;
  s+=`</g>`;
  /* vermelho: macieira */
  s+=`<g filter="url(#sRed)">${arvore(330,930,1.45,'#3FA34A','#5CC25A')}${[[300,560],[390,520],[250,630],[420,610],[340,470],[230,520]].map(([x,y],i)=>`<g><circle cx="${x}" cy="${y}" r="${i===1?30:20}" fill="#F0322F"/><circle cx="${x-6}" cy="${y-6}" r="${i===1?9:6}" fill="#FF9A8F"/><path d="M${x} ${y-(i===1?30:20)} q 4 -12 12 -14" stroke="#6E4220" stroke-width="4" fill="none"/></g>`).join('')}</g>`;
  /* amarelo: campo de flores */
  s+=`<g filter="url(#sYel)">`;const R=rng(9);for(let i=0;i<26;i++){s+=flor(700+R()*560,880+R()*110,.8+R()*.4,'#FFD21F',t,'#FF8A1F');}
  s+=`<g transform="translate(960 900) rotate(${r1(Math.sin(t*1.6)*3)})"><path d="M0 0 Q 10 -100 0 -200" stroke="#3E9C42" stroke-width="12" fill="none"/><ellipse cx="34" cy="-90" rx="36" ry="16" fill="#56B84F" transform="rotate(-30 34 -90)"/>${[0,45,90,135,180,225,270,315].map(a=>`<ellipse cx="0" cy="-262" rx="28" ry="46" fill="#FFD21F" stroke="#F2B000" stroke-width="3" transform="rotate(${a} 0 -220)"/>`).join('')}<circle cx="0" cy="-220" r="32" fill="#FF9A1F"/><circle cx="-10" cy="-230" r="10" fill="#FFC56A"/></g></g>`;

  s+=`<g filter="url(#sBlu)"><ellipse cx="1500" cy="880" rx="330" ry="86" fill="#2E8CF0"/><ellipse cx="1500" cy="866" rx="300" ry="66" fill="#4FB2FF"/>${[0,1,2].map(i=>{const p=((t*.5+i/3)%1);return `<ellipse cx="1500" cy="870" rx="${r1(60+p*220)}" ry="${r1(14+p*50)}" fill="none" stroke="#C8E8FF" stroke-width="4" opacity="${r1(.7*(1-p))}"/>`;}).join('')}<path d="M1300 860 q 20 -8 40 0 M1600 880 q 20 -8 40 0 M1440 900 q 16 -6 32 0" stroke="#E6F5FF" stroke-width="4" fill="none"/>${[1240,1270,1730,1760].map((x,i)=>`<path d="M${x} 880 q -6 -50 4 -90" stroke="#3E9C42" stroke-width="6" fill="none"/><ellipse cx="${x+4}" cy="${790}" rx="6" ry="16" fill="#8A5A2E"/>`).join('')}</g>`;
  return s;
}

/* ---------------- efeitos ---------------- */
function brilhos(x,y,t,n=10,raio=60,cores=['#FFF3A8','#FF9ED8','#C9A2FF','#9FE6FF'],seed=1){const R=rng(seed);let s='';for(let i=0;i<n;i++){const a=R()*Math.PI*2,d=raio*(.3+R()*.7),tw=.5+.5*Math.sin(t*6+i*1.7);s+=estrelinha(x+Math.cos(a)*d,y+Math.sin(a)*d,4+R()*6,cores[i%cores.length],tw);}return s;}
function estrelinha(x,y,r,cor,op=1){return `<path d="M${r1(x)} ${r1(y-r)} Q ${r1(x)} ${r1(y)} ${r1(x+r)} ${r1(y)} Q ${r1(x)} ${r1(y)} ${r1(x)} ${r1(y+r)} Q ${r1(x)} ${r1(y)} ${r1(x-r)} ${r1(y)} Q ${r1(x)} ${r1(y)} ${r1(x)} ${r1(y-r)} Z" fill="${cor}" opacity="${r1(op)}" filter="url(#brilho)"/>`;}
function explosao(x,y,t,t0,cor){const p=prog(t,t0,t0+1.1);if(p<=0||p>=1)return '';let s=`<circle cx="${x}" cy="${y}" r="${r1(20+E.out(p)*260)}" fill="none" stroke="${cor}" stroke-width="${r1(22*(1-p))}" opacity="${r1(1-p)}"/>`;s+=`<circle cx="${x}" cy="${y}" r="${r1(10+E.out(p)*120)}" fill="${cor}" opacity="${r1(.5*(1-p))}" filter="url(#brilhoForte)"/>`;for(let i=0;i<14;i++){const a=i/14*Math.PI*2,d=40+E.out(p)*240;s+=estrelinha(x+Math.cos(a)*d,y+Math.sin(a)*d,14*(1-p)+4,i%2?'#fff':cor,1-p);}return s;}
function confete(t,t0,t1){if(t<t0||t>t1+3)return '';const R=rng(77);let s='';for(let i=0;i<90;i++){const x=R()*1920,v=150+R()*220,ph=R()*6,c=['#FF4FA0','#FFD21F','#2E8CF0','#5CC25A','#B667F2','#FF8A1F'][i%6];const y=-40+((t-t0)*v+R()*400)%1200-200;if(t>t1&&y<0)continue;s+=`<rect x="${r1(x+Math.sin(t*3+ph)*30)}" y="${r1(y)}" width="14" height="22" rx="3" fill="${c}" transform="rotate(${r1((t*200+ph*60)%360)} ${r1(x)} ${r1(y)})"/>`;}return s;}
function arcoIris(p){if(p<=0)return '';const cores=['#FF4D4D','#FF9A1F','#FFD21F','#5CC25A','#2E8CF0','#7B4FC9'];let s=`<g opacity="${r1(p)}">`;cores.forEach((c,i)=>{s+=`<path d="M${200+i*28} 760 A ${760-i*28} ${560-i*24} 0 0 1 ${1720-i*28} 760" stroke="${c}" stroke-width="28" fill="none" stroke-dasharray="2600" stroke-dashoffset="${r1(2600*(1-p))}"/>`;});return s+`</g>`;}

  });return s+`</g>`;}
/* indicador "Sua vez!" nas pausas */
function hudPausa(t){const p=emPausa(t);if(!p)return '';const [a,b]=p;const ap=E.back(prog(t,a,a+.35))*(1-prog(t,b-.25,b));const k=prog(t,a,b);
  const R=54,C=2*Math.PI*R;let s=`<g transform="translate(1720 150) scale(${r1(ap)})"><circle r="78" fill="#fff" filter="url(#sombraSuave)"/><circle r="${R}" fill="none" stroke="#FFE1EF" stroke-width="12"/><circle r="${R}" fill="none" stroke="#FF4FA0" stroke-width="12" stroke-linecap="round" stroke-dasharray="${r1(C)}" stroke-dashoffset="${r1(C*k)}" transform="rotate(-90)"/>`;
  s+=`<g transform="scale(${r1(1+.08*Math.sin(t*8))})"><path d="M-6 -26 C 18 -30 26 -4 14 8 C 6 16 8 24 0 26 C -10 28 -14 18 -10 12" stroke="#FF4FA0" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M-2 -10 C 8 -12 10 0 4 4" stroke="#FF4FA0" stroke-width="6" fill="none" stroke-linecap="round"/></g>`;
  s+=`<g transform="translate(0 112)"><rect x="-96" y="-28" width="192" height="56" rx="28" fill="#FF4FA0"/><text y="12" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="32" fill="#fff">Sua vez!</text></g>`;
  for(let i=0;i<3;i++){s+=`<circle cx="${-26+i*26}" cy="170" r="8" fill="#fff" opacity="${r1(.4+.6*Math.max(0,Math.sin(t*6-i)))}"/>`;}
  return s+`</g>`;}
function cam(cx,cy,z){return `translate(${r1(960-cx*z)} ${r1(540-cy*z)}) scale(${z.toFixed(4)})`;}
function camK(t,keys){ /* keys: [[t,cx,cy,z],...] */
  if(t<=keys[0][0])return keys[0].slice(1);for(let i=0;i<keys.length-1;i++){const [ta,...A]=keys[i],[tb,...B]=keys[i+1];if(t<=tb){const p=E.inOut(prog(t,ta,tb));return A.map((v,j)=>lerp(v,B[j],p));}}return keys[keys.length-1].slice(1);}
/* poses da Liz conforme o momento */
function lizPose(t,base={}){
  const o=Object.assign({expr:'feliz',piscar:piscar(t),pulo:Math.max(0,Math.sin(t*2.2))*4},base);
  if(boca('LIZ',t))o.falar=true;
  const p=emPausa(t);
  if(p){o.expr='sorriso';o.bracoD=150+Math.sin(t*3)*4;o.inclinar=-6;o.olharX=.4;o.falar=false;o.pulo=0;}
  return o;}
function comemora(t,t0,dur=1.6){const p=prog(t,t0,t0+dur);if(p<=0||p>=1)return null;return {expr:'rindo',bracoE:160,bracoD:160,pulo:Math.abs(Math.sin(p*Math.PI*3))*60};}
function voandoLumi(t,x,y,falar){return at(x,y+Math.sin(t*3)*10,1,lumi({bater:(Math.sin(t*22)+1)/2,piscar:piscar(t,1.2),falar}));}
function rastro(t,pts){let s='';pts.forEach(([x,y],i)=>{s+=estrelinha(x,y,3+(i%3)*2,['#FFF3A8','#FF9ED8','#C9A2FF'][i%3],.4+.6*Math.max(0,Math.sin(t*8+i)));});return s;}

function troncoGigante(x,larg,cor='#8A552B'){return `<g transform="translate(${x} 0)"><path d="M${-larg/2} 960 Q ${-larg/2+20} 500 ${-larg/2+30} -200 L ${larg/2-30} -200 Q ${larg/2-20} 500 ${larg/2} 960 Q ${larg/2+60} 990 ${larg/2+90} 1000 L ${-larg/2-90} 1000 Q ${-larg/2-60} 990 ${-larg/2} 960 Z" fill="${cor}"/><path d="M${-larg/4} 900 Q ${-larg/4+10} 500 ${-larg/5} 0 M${larg/5} 920 Q ${larg/5-12} 400 ${larg/4} -100" stroke="#6D3F1D" stroke-width="10" fill="none" opacity=".6"/></g>`;}
function mata(t,o={}){

  if(o.lago){s+=`<ellipse cx="1480" cy="910" rx="340" ry="84" fill="#2E8CF0"/><ellipse cx="1480" cy="896" rx="310" ry="64" fill="#4FB2FF"/>`;for(let i=0;i<3;i++){const p=((t*.45+i/3)%1);s+=`<ellipse cx="1480" cy="900" rx="${r1(60+p*230)}" ry="${r1(14+p*50)}" fill="none" stroke="#C8E8FF" stroke-width="4" opacity="${r1(.7*(1-p))}"/>`;}

    s+=`<g transform="translate(1250 965)"><rect x="-70" y="-70" width="140" height="70" rx="30" fill="#9A6234"/><ellipse cx="-70" cy="-35" rx="14" ry="35" fill="#C68B52"/><ellipse cx="-70" cy="-35" rx="7" ry="22" fill="#A9733F"/></g>`;}

function folhas(t,t0){const p=prog(t,t0-.5,t0+.5);if(p<=0||p>=1)return '';const R=rng(31);let s='';

  return s;}
function coracoes(t,t0,x,y,n=5){const p=prog(t,t0,t0+2.4);if(p<=0||p>=1)return '';let s='';for(let i=0;i<n;i++){const q=clamp(p*1.3-i*.06);const xx=x+Math.sin(q*6+i)*30+(i-n/2)*18,yy=y-q*220;s+=`<path transform="translate(${r1(xx)} ${r1(yy)}) scale(${r1(.8+.4*(i%2))})" d="M0 8 C -14 -4 -12 -16 0 -10 C 12 -16 14 -4 0 8 Z" fill="#FF5A8F" opacity="${r1(1-q)}"/>`;}return s;}
function aguaJato(x,y,t,t0,t1,dir=-1){if(t<t0||t>t1+1.4)return '';let s='';for(let i=0;i<34;i++){const born=t0+i*((t1-t0)/34);const age=t-born;if(age<0||age>1.4)continue;const vx=dir*(90+(i%5)*40),vy=-520-(i%4)*60;const px=x+vx*age,py=y+vy*age+540*age*age;s+=`<circle cx="${r1(px)}" cy="${r1(py)}" r="${6+(i%3)*2}" fill="#7CCBFF" opacity="${r1(.9*(1-age/1.4))}"/>`;}return s;}
function anelDestaque(x,y,t,t0,t1,cor='#FFD23F'){if(t<t0||t>t1)return '';const p=fade(t,t0,t0+.3,t1-.3,t1);return `<ellipse cx="${x}" cy="${y}" rx="${r1(90+10*Math.sin(t*6))}" ry="22" fill="none" stroke="${cor}" stroke-width="8" opacity="${r1(p)}" filter="url(#brilho)"/>`;}
