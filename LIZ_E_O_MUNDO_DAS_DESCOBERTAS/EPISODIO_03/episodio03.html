const at=(x,y,s,inner,extra='')=>`<g transform="translate(${r1(x)} ${r1(y)}) scale(${s})" ${extra}>${inner}</g>`;

const LINES=[[17.6, 21.08, "MAE", "Liz, hoje temos uma surpresa especial!"], [21.38, 22.96, "LIZ", "O que será, mamãe?"], [25.56, 28.35, "LIZ", "Uaaaaau! O que são essas figuras?"], [28.65, 32.85, "MAE", "São formas geométricas! Vamos aprender juntas?"], [33.05, 33.86, "LIZ", "Vamos!"], [33.86, 34.86, "PIPO", "Au! Au!"], [37.26, 40.19, "PAI", "Liz, sabe qual é essa forma?"], [40.49, 42.03, "LIZ", "Não sei, papai!"], [42.33, 44.2, "PAI", "É um círculo!"], [45.6, 49.27, "PAI", "A bola é redondinha, assim como o relógio!"], [49.57, 51.64, "LIZ", "Círculo! Círculo!"], [51.94, 55.75, "LIZ", "Amiguinhos, vocês conseguem encontrar alguma coisa redonda?"], [59.75, 60.81, "LIZ", "Muito bem!"], [63.21, 66.02, "VOVO", "Olha, Liz! Esse é um quadrado!"], [66.32, 68.0, "LIZ", "Ele tem quatro lados!"], [68.3, 71.03, "VOVO", "Muito bem! Vamos contar?"], [71.53, 72.78, "TODOS", "Um!"], [73.38, 74.82, "TODOS", "Dois!"], [75.42, 76.79, "TODOS", "Três!"], [77.39, 78.76, "TODOS", "Quatro!"], [79.36, 83.03, "VOVO", "A janela e os bloquinhos também são quadrados!"], [86.03, 89.0, "LIZ", "Papai! Essa forma tem três pontinhas!"], [89.3, 92.76, "PAI", "Muito bem! É o triângulo!"], [93.96, 95.21, "TODOS", "Um!"], [95.81, 97.25, "TODOS", "Dois!"], [97.85, 99.22, "TODOS", "Três!"], [99.82, 103.78, "PAI", "O telhado da casinha e a placa também são triângulos!"], [106.78, 109.78, "MAE", "Liz, olha o formato deste livro!"], [110.08, 111.42, "LIZ", "Ele é compridinho!"], [111.72, 114.43, "MAE", "Isso mesmo! É um retângulo!"], [115.83, 119.53, "MAE", "A porta, o livro e a televisão são retângulos!"], [122.53, 125.84, "PAI", "Agora vamos brincar de caça às formas!"], [126.04, 127.41, "LIZ", "Vamos, Pipo!"], [127.41, 128.41, "PIPO", "Au! Au!"], [129.61, 132.63, "LIZ", "Achei um círculo! A almofada!"], [134.03, 137.1, "LIZ", "Achei um quadrado! O porta-retrato!"], [138.5, 139.7, "PIPO", "Au! Au! Au!"], [139.7, 142.7, "LIZ", "O Pipo achou um triângulo! A bandeirinha!"], [144.1, 145.78, "LIZ", "E o tapete é um retângulo!"], [146.78, 149.11, "LIZ", "E a bola do papai também é um círculo!"], [149.91, 153.34, "VOVO", "Vamos contar quantas coisas a Liz encontrou?"], [153.74, 154.99, "TODOS", "Um!"], [155.49, 156.93, "TODOS", "Dois!"], [157.43, 158.8, "TODOS", "Três!"], [159.3, 160.67, "TODOS", "Quatro!"], [161.17, 162.63, "TODOS", "Cinco!"], [163.03, 166.51, "VOVO", "Cinco coisas! Parabéns, Liz!"], [168.51, 169.95, "LIZ", "Agora é sua vez!"], [170.55, 171.8, "LIZ", "Que forma é essa?"], [175.3, 176.31, "LIZ", "Círculo!"], [177.31, 178.56, "LIZ", "Que forma é essa?"], [182.06, 183.02, "LIZ", "Quadrado!"], [184.02, 185.26, "LIZ", "Que forma é essa?"], [188.76, 190.01, "LIZ", "Triângulo!"], [191.01, 192.26, "LIZ", "Que forma é essa?"], [195.76, 196.86, "LIZ", "Retângulo!"], [197.46, 199.1, "LIZ", "Você acertou tudo!"], [233.7, 238.04, "LIZ", "Aprender brincando é muito divertido! Até a próxima aventura!"]];

const LS={"abertura": [], "caixa": [17.6, 21.38, 25.56, 28.65, 33.05, 33.86], "circulo": [37.26, 40.49, 42.33, 45.6, 49.57, 51.94, 59.75], "quadrado": [63.21, 66.32, 68.3, 71.53, 73.38, 75.42, 77.39, 79.36], "triangulo": [86.03, 89.3, 93.96, 95.81, 97.85, 99.82], "retangulo": [106.78, 110.08, 111.72, 115.83], "caca": [122.53, 126.04, 127.41, 129.61, 134.03, 138.5, 139.7, 144.1, 146.78, 149.91, 153.74, 155.49, 157.43, 159.3, 161.17, 163.03], "desafio": [168.51, 170.55, 175.3, 177.31, 182.06, 184.02, 188.76, 191.01, 195.76, 197.46], "musica": [233.7]};
const falando=(w,t)=>LINES.some(l=>(l[2]===w||(l[2]==='TODOS'&&['LIZ','MAE','PAI','VOVO'].includes(w)))&&t>=l[0]&&t<l[1]-.08);
const boca=(w,t)=>falando(w,t)&&(Math.floor(t*9)%3!==2);
const piscar=(t,off=0)=>((t+off)%3.7)<.13?1:0;
const emPausa=t=>PAUSES.find(p=>t>=p[0]&&t<p[1]);
const pulinho=(t,vel=1.6,alt=50)=>Math.abs(Math.sin(t*Math.PI*vel))*alt;
const BURST={red:-99,yel:-99,blu:-99,all:-99};
E.in=t=>t*t*t;
/* ---------------- cenários ---------------- */
function nuvem(x,y,s,op=1){return `<g transform="translate(${r1(x)} ${y}) scale(${s})" opacity="${op}"><ellipse cx="0" cy="0" rx="90" ry="38" fill="#fff"/><circle cx="-40" cy="-20" r="40" fill="#fff"/><circle cx="20" cy="-34" r="50" fill="#fff"/><circle cx="62" cy="-10" r="34" fill="#fff"/><ellipse cx="0" cy="18" rx="88" ry="14" fill="#E3F1FF"/></g>`;}
function arvore(x,y,s,c1='#4FB54A',c2='#6FD167'){return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-22 0 Q -16 -110 -10 -170 L 10 -170 Q 16 -110 24 0 Z" fill="#8E5A2E"/><path d="M-6 -150 Q 4 -110 2 -40" stroke="#6E4220" stroke-width="5" fill="none"/><circle cx="0" cy="-230" r="90" fill="${c1}"/><circle cx="-70" cy="-190" r="62" fill="${c1}"/><circle cx="70" cy="-190" r="62" fill="${c1}"/><circle cx="-20" cy="-262" r="58" fill="${c2}"/><circle cx="44" cy="-226" r="40" fill="${c2}"/><circle cx="-60" cy="-206" r="30" fill="${c2}"/></g>`;}
function flor(x,y,s,cor,t,miolo='#FFD23F'){const sw=Math.sin(t*2+x*.01)*6;return `<g transform="translate(${r1(x)} ${y}) rotate(${r1(sw)}) scale(${s})"><path d="M0 0 Q 4 -30 0 -60" stroke="#3E9C42" stroke-width="5" fill="none"/><ellipse cx="10" cy="-26" rx="12" ry="6" fill="#56B84F" transform="rotate(-30 10 -26)"/>${[0,72,144,216,288].map(a=>`<ellipse cx="0" cy="-74" rx="10" ry="15" fill="${cor}" transform="rotate(${a} 0 -62)"/>`).join('')}<circle cx="0" cy="-62" r="9" fill="${miolo}"/></g>`;}
function casaArvore(x,y){return `<g transform="translate(${x} ${y})"><path d="M-40 0 Q -30 -240 -24 -360 L 24 -360 Q 30 -240 44 0 Z" fill="#8E5A2E"/><circle cx="0" cy="-470" r="150" fill="#43A845"/><circle cx="-110" cy="-400" r="100" fill="#43A845"/><circle cx="110" cy="-410" r="100" fill="#4FB54A"/><circle cx="-30" cy="-520" r="90" fill="#62C75C"/>

  <path d="M60 -350 L 150 -60 M 90 -350 L 180 -60" stroke="#A9733E" stroke-width="6"/>${[0,1,2,3,4,5,6].map(i=>`<path d="M${66+i*13} ${-320+i*40} h 30" stroke="#A9733E" stroke-width="6"/>`).join('')}</g>`;}
function fundoFloresta(t,extra=''){

  return s+extra;
}
function porta(x,y,abrir,t){ /* porta azul no tronco gigante */
  const a=E.inOut(abrir);
  let s=`<g transform="translate(${x} ${y})">`;
  s+=`<path d="M-260 0 Q -230 -300 -190 -620 L 190 -620 Q 230 -300 270 0 Q 120 30 0 10 Q -130 30 -260 0 Z" fill="#8A552B"/>`;
  s+=`<path d="M-150 -560 Q -130 -300 -170 -40 M140 -580 Q 160 -300 130 -60 M-60 -600 Q -40 -500 -70 -420" stroke="#6D3F1D" stroke-width="8" fill="none" stroke-linecap="round"/>`;
  s+=`<circle cx="0" cy="-760" r="250" fill="#3E9F45"/><circle cx="-220" cy="-660" r="170" fill="#4FB54A"/><circle cx="230" cy="-660" r="170" fill="#4FB54A"/><circle cx="-60" cy="-860" r="160" fill="#62C75C"/>`;

  s+=`<path d="M-112 -14 L -112 -252 Q -112 -362 0 -362 Q 112 -362 112 -252 L 112 -14" stroke="#F7C744" stroke-width="12" fill="none"/>`;
  const gl=.25+.25*Math.sin(t*4);s+=`<path d="M-112 -14 L -112 -252 Q -112 -362 0 -362 Q 112 -362 112 -252 L 112 -14" stroke="#9FD0FF" stroke-width="24" fill="none" opacity="${r1(gl)}" filter="url(#brilhoForte)"/>`;
  return s+`</g>`;
}
/* Mundo mágico: grupos com saturação independente */

  s+=`<path d="M-400 700 Q 300 580 800 660 Q 1300 740 1700 630 Q 2000 560 2320 640 L 2320 1300 L -400 1300 Z" fill="#9EE08E"/>`;

  s+=`<g filter="url(#sRed)">${arvore(330,930,1.45,'#3FA34A','#5CC25A')}${[[300,560],[390,520],[250,630],[420,610],[340,470],[230,520]].map(([x,y],i)=>`<g><circle cx="${x}" cy="${y}" r="${i===1?30:20}" fill="#F0322F"/><circle cx="${x-6}" cy="${y-6}" r="${i===1?9:6}" fill="#FF9A8F"/><path d="M${x} ${y-(i===1?30:20)} q 4 -12 12 -14" stroke="#6E4220" stroke-width="4" fill="none"/></g>`).join('')}</g>`;
  /* amarelo: campo de flores */

  const whoosh=(x,dur=.5,v=1)=>{if(!ok(x))return;const n=ruido(x,dur),f=ctx.createBiquadFilter(),g=ctx.createGain();f.type='bandpass';f.Q.value=1.5;f.frequency.setValueAtTime(500,T(x));f.frequency.exponentialRampToValueAtTime(3500,T(x)+dur*.6);f.frequency.exponentialRampToValueAtTime(900,T(x)+dur);g.gain.setValueAtTime(.0001,T(x));g.gain.linearRampToValueAtTime(.22*v,T(x)+dur*.5);g.gain.linearRampToValueAtTime(.0001,T(x)+dur);n.connect(f);f.connect(g);out(g,master,1,.3);};

    const n=ruido(x,.12),f2=ctx.createBiquadFilter(),g2=ctx.createGain();f2.type='bandpass';f2.frequency.value=900;env(g2,x,.004,.12*v,.09);n.connect(f2);f2.connect(g2);out(g2,master);};
  const bip=(x,m=84,dur=.08,v=1)=>{if(!ok(x))return;const o=osc('square',mtof(m),x,dur);const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=3000;const g=ctx.createGain();env(g,x,.003,.08*v,dur);o.connect(f);f.connect(g);out(g,master,1,.15);};
  const bola=(x,v=1)=>{if(!ok(x))return;const o=osc('sine',220,x,.15);o.frequency.exponentialRampToValueAtTime(90,T(x)+.1);const g=ctx.createGain();env(g,x,.002,.3*v,.1);o.connect(g);out(g,master);};
  const rangido=(x,dur=1.1)=>{if(!ok(x))return;const o=osc('sawtooth',95,x,dur);const lfo=osc('sine',7,x,dur);const lg=ctx.createGain();lg.gain.value=25;lfo.connect(lg);lg.connect(o.frequency);o.frequency.linearRampToValueAtTime(140,T(x)+dur);const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=900;f.Q.value=4;const g=ctx.createGain();g.gain.setValueAtTime(.0001,T(x));g.gain.linearRampToValueAtTime(.12,T(x)+.15);g.gain.linearRampToValueAtTime(.0001,T(x)+dur);o.connect(f);f.connect(g);out(g,master,1,.4);};
  const vinheta=(x)=>{[72,76,79,84].forEach((m,i)=>sino(x+i*.11,m,.3,1.1));sino(x+.44,88,.9,1);brilho(x+.3,1.2,8,Math.floor(x));};
  const corneta=(x)=>{if(!ok(x))return;const o=osc('sawtooth',300,x,.7);o.frequency.exponentialRampToValueAtTime(700,T(x)+.5);const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=1800;const g=ctx.createGain();env(g,x,.02,.12,.6);o.connect(f);f.connect(g);out(g,master,1,.3);};
  /* arranjos */
  function tema(x0,compassos=8,bateria=true,melodia=true,v=1){
    for(let b=0;b<compassos;b++){const ac=ACORDES[TEMA_AC[b%8]],x=x0+b*2;

  }
  function leito(x0,x1,v=.55){for(let x=x0;x<x1-.01;x+=2){const ac=ACORDES[LEITO_AC[Math.floor((x-x0)/2)%4]];
      for(let k=0;k<8;k++){const xx=x+k*.25;if(xx<x1)ukulele(xx,ac[[0,2,1,3,2,1,3,2][k]],v);}baixo(x,ac[0],.45,v);if(x+1<x1)baixo(x+1,ac[2],.45,v*.8);}}
  /* ---------- episódio 3: instrumentos e música original "Formas para Reconhecer" ---------- */
  const marimba=(x,m,v=1)=>{if(!ok(x))return;const f=mtof(m);const g=ctx.createGain();env(g,x,.002,.11*v,.3);[[1,'sine',1],[4,'sine',.18]].forEach(([k,ty,a])=>{const o=osc(ty,f*k,x,.38);const gg=ctx.createGain();gg.gain.value=a;o.connect(gg);gg.connect(g);});out(g,mus,1,.3);};

  const giro=(x,v=1)=>{if(!ok(x))return;const o=osc('sine',500,x,.9);o.frequency.exponentialRampToValueAtTime(1400,T(x)+.45);o.frequency.exponentialRampToValueAtTime(700,T(x)+.9);const lfo=osc('sine',12,x,.9),lg=ctx.createGain();lg.gain.value=40;lfo.connect(lg);lg.connect(o.frequency);const g=ctx.createGain();env(g,x,.05,.08*v,.8);o.connect(g);out(g,master,1,.4);};
  const ding=(x,v=1)=>{sino(x,88,.5,.8*v);sino(x+.08,93,.6,.6*v);};

  const CANCAO_AC=['C','G','C','C','F','C','G','C','F','C','F','G','C','Am','F','G'];

    [67,67,64,67,69,69,67,64,62],[67,67,64,67,69,69,67,64,67],[69,69,65,69,71,71,69,65,64],[67,67,64,62,64,65,64,62,60],

      baixo(x,ac[0],.45,v);baixo(x+1,ac[0],.45,v);baixo(x+1.5,ac[2],.3,.7*v);

    [60,64,67,72].forEach(m=>sino(x0+32,m,1.6,.9));baixo(x0+32,48,1.4);bumbo(x0+32,1);corneta(x0+32.1);
  }
  /* ---------- arranjo do episódio 3 ---------- */
  const sc=Object.fromEntries(SCENES.map(s=>[s[0],[s[1],s[2]]]));
  tema(0,8,true,true,1);pop(1.0);latido(3.2);latido(3.45);bip(5.0,88);bip(5.12,84);harpa(6.5,.8);brilho(9.5,1.2,10,9);whoosh(8.4,.6);sino(10.4,'C6',1.2,1);vinheta(11.6);[12,12.15,12.3,12.45].forEach(x=>pop(x,.6));whoosh(15.5,.5);
  /* leito da sala, suave, até a música final */
  leito(16,sc.musica[0],.4);
  /* transições com formas */
  SCENES.slice(2).forEach(([n,a])=>whoosh(a-.45,.8,.8));
  /* caixa mágica */
  {const ab=A.caixa.abre;rangido(ab-.2,.6);harpa(ab,1.1);brilho(ab+.1,1.4,14,5);[0,.18,.36,.54].forEach((d,i)=>{pop(ab+.25+d,.8);sino(ab+.25+d,[72,76,79,84][i],.3,.7);});latido(LS.caixa[5]+.05);latido(LS.caixa[5]+.45);vinheta(LS.caixa[4]);}
  /* formas gigantes: aparecem girando */
  [['circulo',A.circulo.gira],['quadrado',LS.quadrado[0]+.6],['triangulo',A.triangulo.gira],['retangulo',A.retangulo.gira]].forEach(([k,x])=>{whoosh(x-.2,.5,.7);giro(x);vinheta(x+.3);});

  /* contagens: xilofone subindo */
  [[LS.quadrado,[3,4,5,6]],[LS.triangulo,[2,3,4]],[LS.caca,[10,11,12,13,14]]].forEach(([Ls,ks])=>ks.forEach((k,i)=>{xilo(Ls[k],[72,74,76,77,79][i]);pop(Ls[k]+.05,.6);}));

  const fo=ctx.createGain();
  master.gain.setValueAtTime(.85,Math.max(T(off),T(D-1.4)));master.gain.linearRampToValueAtTime(.0001,T(D));

}
async function renderAudioWav(){
  const sr=48000,ctx=new OfflineAudioContext(2,sr*D,sr);trilha(ctx,ctx.destination,0,0);const buf=await ctx.startRendering();
  return wav(buf);}
async function renderTemaWav(){ /* música de abertura isolada (16 s) */
  const sr=48000,ctx=new OfflineAudioContext(2,sr*17,sr);trilha(ctx,ctx.destination,0,0);const buf=await ctx.startRendering();return wav(buf);}
function wav(buf){const L=buf.getChannelData(0),R=buf.getChannelData(1),n=buf.length;const ab=new ArrayBuffer(44+n*4),dv=new DataView(ab);const ws=(o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF');dv.setUint32(4,36+n*4,true);ws(8,'WAVE');ws(12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,2,true);dv.setUint32(24,buf.sampleRate,true);dv.setUint32(28,buf.sampleRate*4,true);dv.setUint16(32,4,true);dv.setUint16(34,16,true);ws(36,'data');dv.setUint32(40,n*4,true);
  let o=44;for(let i=0;i<n;i++){dv.setInt16(o,clamp(L[i],-1,1)*32767,true);dv.setInt16(o+2,clamp(R[i],-1,1)*32767,true);o+=4;}
  const u=new Uint8Array(ab);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);}
function srt(){const f=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=Math.floor(s%60),ms=Math.round((s%1)*1000);return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')},${String(ms).padStart(3,'0')}`;};
  return LINES.map((l,i)=>`${i+1}\n${f(l[0])} --> ${f(l[1]+.2)}\n${WHO[l[2]][0]}: ${l[3]}\n`).join('\n');}

/* ---------------- player ---------------- */
const params=new URLSearchParams(location.search),render=params.has('render');

let T0=0,playing=false,actx=null,aStart=0,aNode=null,perf=0,raf=0;
const stage=document.getElementById('stage');
function fit(){if(render){stage.style.transform='none';return;}const vp=document.getElementById('vp');stage.style.transform=`scale(${vp.clientWidth/1920})`;}
function now(){if(!playing)return T0;if(actx&&aNode)return T0+(actx.currentTime-aStart);return T0+(performance.now()-perf)/1000;}
function stopA(){if(aNode){try{aNode.disconnect();}catch(e){}aNode=null;}}

else{document.getElementById('play').onclick=()=>playing?pause():play();
